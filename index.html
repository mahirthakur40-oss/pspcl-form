<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSPCL Meter Sealing Certificate</title>
<style>
:root{--bg:#eef1f6;--ink:#14213d;--bar:#1f4e9c;--card:#fff;--line:#d5dbe6;--muted:#5b6678;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--ink:#e6ebf5;--bar:#16326b;--card:#1a2130;--line:#2b3548;--muted:#9aa6bb;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f141c;--ink:#e6ebf5;--bar:#16326b;--card:#1a2130;--line:#2b3548;--muted:#9aa6bb;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.bar h1{font-size:16px;margin:0 auto 0 0;font-weight:700}
.btn{font:inherit;padding:8px 14px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:6px;cursor:pointer}
.btn.pri{background:#fff;color:#1f4e9c;font-weight:700;border-color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffb703;outline-offset:1px}
.status{padding:10px 14px;color:var(--muted);font-size:13px}
.wrap{overflow-x:auto;padding:0 12px 24px}
.sheet{min-width:1095px;background:#fff;color:#111;border:2px solid #111}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
td{border:1px solid #333;height:26px;padding:0 5px;vertical-align:middle;word-wrap:break-word}
td.i{padding:0}
td.c{text-align:center}
td.b{font-weight:700}
tr.t2 td{height:42px}
tr.t3 td{height:58px}
td.logo{padding:4px 8px}
td.title{text-align:center;font-weight:700;font-size:12px}
.logoimg{display:block;height:44px;width:auto;max-width:100%}
.lg{display:flex;align-items:center;gap:6px;color:#1f4e9c;font-weight:700;font-size:17px;line-height:1}
.lg small{display:block;font-size:6px;color:#777;font-weight:400;margin-top:2px}
td.cert{font-size:11px;height:20px}
input,select{width:100%;height:100%;min-height:24px;display:block;border:0;background:transparent;color:#111;font:12px Calibri,Carlito,Arial,sans-serif;padding:3px 5px;border-radius:0}
tr.t2 input{min-height:40px}
input:focus,select:focus{background:#fff8d6;box-shadow:inset 0 0 0 2px #1f4e9c;outline:none}
.list{max-width:760px;margin:0 auto;padding:12px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px;min-height:42px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.info{flex:1;min-width:0}
.info b{font-size:16px}
.meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{font:inherit;padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.sm.del{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.empty .sm{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 18px;border-radius:8px;z-index:9}
input[type=checkbox]{width:auto;height:auto;min-height:0;display:inline-block}
.admin{max-width:1100px}
.lock{max-width:340px;margin:40px auto;text-align:center}
.lock h2{margin:0 0 6px}
.pin{-webkit-text-security:disc;letter-spacing:4px;font-size:20px;color:var(--ink)}
.pin.show{-webkit-text-security:none}
.showpin{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:8px}
.lock .search{text-align:center;margin:14px 0 6px}
.err{color:var(--danger);min-height:20px;font-size:13px;margin-bottom:8px}
.go{background:#1f4e9c;color:#fff;border:0;padding:10px 20px;border-radius:6px;font:inherit;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{font-size:18px;display:block;margin-top:2px}
.atools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.atools .search{flex:1;min-width:180px;width:auto;margin:0}
.atools label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.atools label.sm{color:var(--ink);font-size:15px}
.atools input[type=date]{width:auto;height:auto;min-height:36px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:6px 8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
.at{width:100%;min-width:900px;table-layout:auto;font-size:13px}
.at th,.at td{border:0;border-bottom:1px solid var(--line);text-align:left;padding:8px 10px;height:auto;vertical-align:top}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tick{display:none;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);align-items:center;justify-content:center;color:#fff;font-size:14px;line-height:1}
.selmode .tick{display:flex}
.selmode .item button{display:none}
.item.sel{border-color:var(--bar);background:color-mix(in srgb,var(--bar) 14%,var(--card))}
.item.sel .tick{background:var(--bar);border-color:var(--bar)}
.item.sel .tick::after{content:"\2713"}
.hint{margin:0 0 10px}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:340px;text-align:center}
.lbox h2{margin:0 0 4px;font-size:20px}
.lbox .search{margin-bottom:10px;text-align:left}
@media print{
.bar,.status,#listView,#adminView,.toast{display:none!important}
body{background:#fff}
.wrap{padding:0;overflow:visible}
.sheet{min-width:0}
select{-webkit-appearance:none;appearance:none}
@page{size:A4 landscape;margin:8mm}
}
</style>

/* ---------- storage ---------- */
const db=()=>firebase.firestore();
let remote=new Map(),firstSnap=null;
function load(){return firstSnap||(firstSnap=new Promise(res=>{
 db().collection('forms').onSnapshot(snap=>{
  forms=snap.docs.map(d=>d.data());
  remote=new Map(forms.map(f=>[f.id,JSON.stringify(f)]));
  res();
  if(!$('#listView').hidden)renderList();
  if(unlocked&&!$('#adminView').hidden)drawAdmin();
  $('#listBtn').textContent=`Saved Forms (${forms.length})`;
 },()=>{toast('Cannot read data. Check internet and login.');res()});
}))}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pspcl:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function persist(){
 const d=db(),col=d.collection('forms'),cur=new Map(forms.map(f=>[f.id,JSON.stringify(f)])),jobs=[];
 let batch=d.batch(),n=0;
 const flush=()=>{if(n){jobs.push(batch.commit());batch=d.batch();n=0}};
 forms.forEach(f=>{if(remote.get(f.id)!==cur.get(f.id)){batch.set(col.doc(f.id),f);if(++n>=400)flush()}});
 remote.forEach((_,id)=>{if(!cur.has(id)){batch.delete(col.doc(id));if(++n>=400)flush()}});
 flush();
 Promise.all(jobs).catch(()=>toast('Could not save. Check your internet.'));
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>new Date(ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});

/* ---------- form actions ---------- */
const collect=()=>{const o={};$$('[data-k]').forEach(e=>o[e.dataset.k]=e.value);return o};
const fill=o=>$$('[data-k]').forEach(e=>e.value=o[e.dataset.k]??'');
function show(v){
 if(v!=='list'&&pickMode)exitPick();
 $('#formView').hidden=v!=='form';$('#listView').hidden=v!=='list';$('#adminView').hidden=v!=='admin';
 $('#saveBtn').hidden=$('#printBtn').hidden=v!=='form';
 $('#listBtn').textContent=`Saved Forms (${forms.length})`;
 $('#status').textContent=curId?'Editing a saved form. Select Save Form to update it.':'New form';
 window.scrollTo(0,0);
}
function newForm(){
 const d={...DEF};
 const last=[...forms].sort((a,b)=>b.createdAt-a.createdAt)[0];
 if(last){
  d.book=last.data.book||d.book;
  const m=/^(.*?)(\d+)\s*$/.exec(last.data.page||'');
  if(m)d.page=m[1]+String(+m[2]+1).padStart(m[2].length,'0');
 }
 curId=null;fill(d);show('form');
}
function save(){
 const data=collect(),now=Date.now();
 const f=forms.find(x=>x.id===curId);
 if(f){f.data=data;f.updatedAt=now}
 else{forms.unshift({id:now.toString(36)+Math.random().toString(36).slice(2,6),createdAt:now,updatedAt:now,data});}
 persist();curId=null;renderList();show('list');toast('Form saved');
}
function openForm(id){
 const f=forms.find(x=>x.id===id);if(!f)return;
 curId=id;fill(f.data);show('form');
}

/* ---------- saved list ---------- */
function renderList(){
 const q=$('#q').value.trim().toLowerCase();
 const rows=[...forms].sort((a,b)=>b.updatedAt-a.updatedAt).filter(f=>!q||Object.values(f.data).join(' ').toLowerCase().includes(q));
 $('#items').innerHTML=rows.length?rows.map(f=>{const d=f.data;return `<div class="item" data-id="${f.id}"><span class="tick"></span><div class="info"><b>${esc(d.book)}</b> &nbsp;Page ${esc(d.page)}<div class="meta">${esc(d.consumer||'No consumer name')}${d.dtname?', DT: '+esc(d.dtname):''}</div><div class="meta">Form date: ${esc(d.date||'not set')}, saved ${fmt(f.updatedAt)}</div></div><button class="sm" data-a="edit">Edit</button><button class="sm del" data-a="del">Delete</button></div>`}).join(''):
 `<div class="empty">${forms.length?'No form matches your search.':'No saved forms yet. Fill the form and select Save Form.'}<br><button class="sm" data-a="new">New Form</button></div>`;
 $('#listBtn').textContent=`Saved Forms (${forms.length})`;
if(pickMode)updatePick();
}
$('#items').onclick=e=>{
 if(suppress){suppress=false;return}
 const it=e.target.closest('.item');
 if(pickMode){if(it)togglePick(it.dataset.id);return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a==='new')return newForm();
 const id=b.closest('.item').dataset.id;
 if(b.dataset.a==='edit')openForm(id);
 if(b.dataset.a==='del'){
  if(b.dataset.armed){forms=forms.filter(f=>f.id!==id);persist();renderList();toast('Form deleted')}
  else{b.dataset.armed='1';b.textContent='Tap again to delete';setTimeout(()=>{b.dataset.armed='';b.textContent='Delete'},3000)}
 }
};
$('#q').oninput=renderList;

let unlocked=false,sel=new Set(),adminToken='',pinSet=false;const J={'Content-Type':'application/json'};
const today=()=>new Date().toLocaleDateString('en-CA');
const fdate=f=>f.data.date||new Date(f.createdAt).toLocaleDateString('en-CA');
const LBL={book:'Book Number',page:'Page',date:'Date',time:'Time',division:'Division',subdiv:'Sub Division',substation:'SubStation',feeder:'Feeder',dtname:'DT Name',dtrcap:'DTR Capacity',category:'Category',district:'District',dtcode:'DT Code',consumer:'Consumer Name',metered:'Metered',nearby:'Nearby DT Address',remarks:'Remarks',agency:'Executing Agency',tech_sig:'Technician Signature',je_sig:'PSPCL JE Signature',sup:'Name of Supervisor',mob:'Supervisor Mobile',sdo_sig:'PSPCL SDO Signature',sdo_desig:'SDO Designation',sdo_mob:'SDO Mobile'};
const SUB={mno:'Meter Number',year:'Year',make:'Meter Make',cap:'Meter Capacity',cond:'Meter Condition',md:'MD (KVA)',kwh:'KWH',kvah:'KVAH',mct:'Meter C.T. Ratio',lct:'Line C.T. Ratio',mpt:'Meter P.T. Ratio',lpt:'Line P.T. Ratio'};
const SEAL={body:'Body Seal',tp:'T.P. Seal',nic:'NIC Card Seal',mch:'Meter Chamber Seal',ctch:'C.T. Chamber Seal'};
function lbl(k){
 if(LBL[k])return LBL[k];
 let m=/^cr(\d)$/.exec(k);if(m)return 'Cable Rating '+m[1];
 m=/^cd(\d)$/.exec(k);if(m)return 'Cable Details '+m[1];
 m=/^([on])_(.+)$/.exec(k);if(!m)return k;
 const side=m[1]==='o'?'Old ':'New ';
 if(SUB[m[2]])return side+SUB[m[2]];
 const z=/^(.+)_([ph])$/.exec(m[2]);
 return z&&SEAL[z[1]]?side+SEAL[z[1]]+(z[2]==='p'?' Plastic':' Holographic'):k;
}
async function saveFile(name,data){
 try{
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('File saved in Downloads');
 }catch(e){toast('Could not save the file')}
}
async function renderLock(msg='',mode=''){
 if(!mode){try{const d=await db().doc('config/admin').get();pinSet=!!(d.exists&&d.data().pin)}catch(e){}}
 const has=mode==='set'?false:pinSet;
 $('#adminBody').innerHTML=`<div class="lock"><h2>${has?'Admin login':'Set an admin PIN'}</h2><p class="meta">${has?'Enter your PIN to open the admin panel.':'Choose a PIN of at least 4 characters. You will enter it each time you open the admin panel.'}</p><input class="search pin" id="pin" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false" name="pspcl-admin-code" placeholder="PIN"><label class="showpin"><input type="checkbox" id="showPin"> Show PIN</label><div class="err">${msg}</div><button class="go" id="pinGo">${has?'Unlock':'Save PIN'}</button></div>`;
 const go=async()=>{const v=$('#pin').value.trim();
  try{
   const ref=db().doc('config/admin');
   if(has){
    const d=await ref.get();
    if(d.exists&&await sha(v)===d.data().pin){unlocked=true;renderAdmin()}else renderLock('Wrong PIN. Try again.');
   }else{
    if(v.length<4)return renderLock('PIN must be at least 4 characters.',mode);
    await ref.set({pin:await sha(v)});pinSet=true;unlocked=true;renderAdmin();toast('PIN saved');
   }
  }catch(e){renderLock('Could not reach the database. Check internet.',mode)}};
 $('#pinGo').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};$('#showPin').onchange=e=>$('#pin').classList.toggle('show',e.target.checked);$('#pin').focus();
}

  const keys=$$('[data-k]').map(e=>e.dataset.k),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Saved on',...keys.map(lbl)].map(q).join(',')];
  filtered().forEach(f=>rows.push([fmt(f.updatedAt),...keys.map(k=>f.data[k])].map(q).join(',')));
  saveFile(`pspcl-forms-${today()}.csv`,'\uFEFF'+rows.join('\r\n'));
 };
 $('#aBak').onclick=()=>saveFile(`pspcl-backup-${today()}.json`,JSON.stringify({app:'pspcl-mco',forms}));
 $('#aRes').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
   const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.forms;if(!Array.isArray(arr))throw 0;
   let n=0;arr.forEach(x=>{if(x&&x.id&&x.data&&typeof x.data==='object'&&!forms.some(f=>f.id===String(x.id))){forms.push({id:String(x.id),createdAt:+x.createdAt||Date.now(),updatedAt:+x.updatedAt||Date.now(),data:x.data});n++}});
   persist();renderList();drawAdmin();toast(n+' forms restored');
  }catch(err){toast('This is not a valid backup file')}};
  r.readAsText(file);e.target.value='';
 };
 $('#aPin').onclick=()=>renderLock('','set');
 $('#aLock').onclick=()=>{unlocked=false;renderLock()};
 drawAdmin();
}
function drawAdmin(){
 const t=today(),last=[...forms].sort((x,y)=>y.updatedAt-x.updatedAt)[0];
 const st=[['Total forms',forms.length],['Saved today',forms.filter(f=>new Date(f.updatedAt).toLocaleDateString('en-CA')===t).length],['Forms this month',forms.filter(f=>fdate(f).slice(0,7)===t.slice(0,7)).length],['Last saved',last?fmt(last.updatedAt):'None yet']];
 $('#stats').innerHTML=st.map(([l,v])=>`<div class="stat"><div class="meta">${l}</div><b>${esc(v)}</b></div>`).join('');
 sel=new Set([...sel].filter(id=>forms.some(f=>f.id===id)));
 const rows=filtered();
 $('#arows').innerHTML=rows.length?rows.map(f=>{const d=f.data;return `<tr data-id="${f.id}"><td><input type="checkbox" class="ck" ${sel.has(f.id)?'checked':''} aria-label="Select form"></td><td><b>${esc(d.book)}</b><br>Page ${esc(d.page)}</td><td>${esc(fdate(f))}</td><td>${esc(d.consumer)}</td><td>${esc(d.dtname)}</td><td>${esc(d.division)}</td><td>${esc(d.o_mno)}</td><td>${esc(d.n_mno)}</td><td>${fmt(f.updatedAt)}</td><td><button class="sm" data-a="edit">Edit</button></td></tr>`}).join(''):'<tr><td colspan="10" class="empty">No forms found.</td></tr>';
 $('#aDel').textContent=sel.size?`Delete selected (${sel.size})`:'Delete selected';
 $('#aAll').checked=rows.length>0&&rows.every(f=>sel.has(f.id));
}
$('#adminBtn').onclick=async()=>{show('admin');await load();unlocked?renderAdmin():renderLock()};

/* ---------- long press selection (list) ---------- */
let pickMode=false,suppress=false,lpT=null,lpX=0,lpY=0;const pick=new Set();
function updatePick(){
 $('#mainBar').hidden=pickMode;$('#selBar').hidden=!pickMode;
 $('#items').classList.toggle('selmode',pickMode);
 const els=$$('#items .item');
 els.forEach(el=>el.classList.toggle('sel',pick.has(el.dataset.id)));
 $('#pickCount').textContent=pick.size+' selected';
 $('#pickAll').textContent=els.length&&els.every(el=>pick.has(el.dataset.id))?'Deselect all':'Select all';
}
function enterPick(id){pickMode=true;pick.add(id);updatePick()}
function exitPick(){pickMode=false;pick.clear();updatePick()}
function togglePick(id){pick.has(id)?pick.delete(id):pick.add(id);pick.size?updatePick():exitPick()}
const itemsEl=$('#items');
itemsEl.addEventListener('pointerdown',e=>{
 suppress=false;
 const it=e.target.closest('.item');
 if(!it||pickMode)return;
 lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
 lpT=setTimeout(()=>{suppress=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}enterPick(it.dataset.id)},500);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>itemsEl.addEventListener(t,()=>clearTimeout(lpT)));
itemsEl.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)clearTimeout(lpT)});
itemsEl.addEventListener('contextmenu',e=>{if(e.target.closest('.item'))e.preventDefault()});
$('#pickX').onclick=exitPick;
$('#pickAll').onclick=()=>{
 const els=$$('#items .item'),all=els.every(el=>pick.has(el.dataset.id));
 els.forEach(el=>all?pick.delete(el.dataset.id):pick.add(el.dataset.id));
 pick.size?updatePick():exitPick();
};
$('#pickDel').onclick=e=>{const b=e.currentTarget;
 if(b.dataset.armed){forms=forms.filter(f=>!pick.has(f.id));persist();exitPick();renderList();toast('Forms deleted')}
 else{b.dataset.armed='1';b.textContent='Tap again';setTimeout(()=>{b.dataset.armed='';b.textContent='Delete'},3000)}};
const COLW=[148,105,102,127,131,107,170,105,100];
let pdfL=null;
function pdfLayout(){
 if(pdfL)return pdfL;
 const rows=[...document.querySelectorAll('#sheet tr')],occ=[],cells=[],rh=[];
 rows.forEach((tr,r)=>{
  occ[r]=occ[r]||[];let c=0;
  rh[r]=tr.classList.contains('t3')?48:tr.classList.contains('t2')?30:22;
  [...tr.children].forEach(td=>{
   while(occ[r][c])c++;
   const cs=td.colSpan||1,rs=td.rowSpan||1;
   for(let i=0;i<rs;i++){occ[r+i]=occ[r+i]||[];for(let j=0;j<cs;j++)occ[r+i][c+j]=1}
   const inp=td.querySelector('[data-k]'),im=td.querySelector('img');
   let text='';
   if(!inp&&!im){const t=td.cloneNode(true);t.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));text=t.textContent.trim()}
   cells.push({r,c,cs,rs,key:inp?inp.dataset.k:null,text,img:im?im.src:null,center:td.classList.contains('c')||td.classList.contains('title'),bold:td.classList.contains('b')||td.classList.contains('title')});
   c+=cs;
  });
 });
 return pdfL={cells,rh};
}
function drawForm(doc,f,Ly){
 const sc=281/1095,x0=8,y0=8,cx=[0],ry=[0];
 COLW.forEach(w=>cx.push(cx[cx.length-1]+w*sc));
 Ly.rh.forEach(h=>ry.push(ry[ry.length-1]+h*sc));
 doc.setDrawColor(30);doc.setLineWidth(0.2);
 Ly.cells.forEach(cl=>{
  const x=x0+cx[cl.c],y=y0+ry[cl.r],w=cx[cl.c+cl.cs]-cx[cl.c],h=ry[cl.r+cl.rs]-ry[cl.r];
  doc.rect(x,y,w,h);
  if(cl.img){try{doc.addImage(cl.img,'JPEG',x+1.5,y+1.5,(h-3)*221/81,h-3)}catch(e){}return}
  let t=cl.key?(f.data[cl.key]||''):cl.text;
  if(cl.key==='date'&&/^\d{4}-\d\d-\d\d$/.test(t))t=t.split('-').reverse().join('/');
  if(!t)return;
  doc.setFont('helvetica',cl.bold?'bold':'normal');doc.setTextColor(17);
  let fs=cl.key?8:7.5,lines;
  for(;fs>4.5;fs-=.5){doc.setFontSize(fs);lines=doc.splitTextToSize(String(t),w-2);if(lines.length*fs*0.42<=h)break}
  const gap=fs*0.42,ty=y+h/2-(lines.length-1)*gap/2;
  lines.forEach((ln,i)=>doc.text(ln,cl.center?x+w/2:x+1.2,ty+i*gap,{align:cl.center?'center':'left',baseline:'middle'}));
 });
 doc.setLineWidth(0.6);doc.rect(x0,y0,cx[cx.length-1],ry[ry.length-1]);
}
function makePdf(list){
 if(!window.jspdf){toast('PDF tool could not load. Check your internet and refresh the page.');return null}
 const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),Ly=pdfLayout();
 list.forEach((f,i)=>{if(i)doc.addPage();drawForm(doc,f,Ly)});
 return doc.output('blob');
}
const pdfName=l=>(l.length===1?`${l[0].data.book||'form'}-${l[0].data.page||''}`:`pspcl-forms-${today()}`).replace(/[^\w.-]+/g,'_')+'.pdf';
const picked=()=>forms.filter(f=>pick.has(f.id));
$('#pickPdf').onclick=async()=>{
 const l=picked();if(!l.length)return;
 const b=makePdf(l);if(!b)return;
 await saveFile(pdfName(l),b);exitPick();
};
$('#pickShare').onclick=async()=>{
 const l=picked();if(!l.length)return;
 const b=makePdf(l);if(!b)return;
 const file=new File([b],pdfName(l),{type:'application/pdf'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'PSPCL Meter Sealing Certificate'});exitPick();return}
 }catch(err){if(err&&err.name==='AbortError')return}
 await saveFile(pdfName(l),b);exitPick();
};

$('#lGo').onclick=async()=>{
 $('#loginMsg').textContent='';
 try{await firebase.auth().signInWithEmailAndPassword($('#lEmail').value.trim(),$('#lPass').value)}
 catch(e){$('#loginMsg').textContent=e.code==='auth/network-request-failed'?'No internet. Try again.':'Wrong email or password.'}
};
$('#lPass').onkeydown=e=>{if(e.key==='Enter')$('#lGo').click()};
$('#outBtn').onclick=()=>firebase.auth().signOut().then(()=>location.reload());
const FC=window.FIREBASE_CONFIG;
if(!FC||!FC.apiKey){$('#login').hidden=false;$('#loginMsg').textContent='Setup not finished: config.js is missing or empty.'}
else{
 firebase.initializeApp(FC);
 try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 let started=false;
 firebase.auth().onAuthStateChanged(async u=>{
  if(!u){started=false;$('#login').hidden=false;return}
  $('#login').hidden=true;
  if(started)return;started=true;
  await load();renderList();newForm();
  if(location.hash==='#admin'){show('admin');renderLock()}
 });
}
</script>
